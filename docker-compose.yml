version: '3.8'

services:
  backend:
    build: 
      context: ./Server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql  # Points to the MySQL service
      - DB_USER=root
      - DB_PASSWORD=your_mysql_password
      - DB_NAME=inventory_db
    depends_on:
      - mysql
    volumes:
      - ./nodeapi:/app
      - /app/node_modules

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=your_mysql_password
      - MYSQL_DATABASE=inventory_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql  # Optional: SQL seed file

volumes:
  mysql-data: